<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />

<!-- 给 body 添加 page-dark 类，即可启用深色详情页主题 -->
<body class="page-dark">
<div class="page-topbar">
    <a class="page-back" href="all-projects.html"><span class="page-back__arrow">&#8592;</span> 返回</a><span class="page-topbar__title">项目中文标题</span>
  </div>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">梁金玲 · Portfolio</a>
      <nav class="nav">
        <a href="index.html#works" class="nav-link">作品</a>
        <a href="index.html#contact" class="nav-link">联系</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- 1. 项目主图：替换 src 即可 -->
    <figure class="detail-hero">
      <img src="assets/images/project-chaoshan.png" alt="项目主视觉" />
    </figure>

    <!-- 2. 项目信息：修改 label、title、tags、desc -->
    <header class="detail-header">
      <p class="detail-label">Project 00 · 项目英文名</p>
      <h1 class="detail-title">项目中文标题</h1>
      <div class="detail-tags">
        <span class="tag">标签一</span>
        <span class="tag">标签二</span>
        <span class="tag">标签三</span>
      </div>
      <p class="detail-desc">
        在这里填写项目背景、核心挑战与设计目标的概述。建议控制在 3-5 行，保持简洁有力。
      </p>
    </header>

    <!-- 3. 项目画廊：可切换 cols-2 / cols-3 -->
    <section class="detail-gallery cols-3" aria-label="项目展示">
      <img src="assets/images/project-chaoshan.png" alt="展示图 1" />
      <img src="assets/images/project-xilan.png" alt="展示图 2" />
      <img src="assets/images/project-sony.png" alt="展示图 3" />
    </section>

    <!-- 4. 设计维度卡片：修改标题与描述 -->
    <section class="detail-section">
      <h2 class="detail-section-title">设计维度</h2>
      <div class="detail-cards">
        <div class="detail-card">
          <h3 class="detail-card-title">维度一</h3>
          <p class="detail-card-text">维度说明文字。</p>
        </div>
        <div class="detail-card">
          <h3 class="detail-card-title">维度二</h3>
          <p class="detail-card-text">维度说明文字。</p>
        </div>
        <div class="detail-card">
          <h3 class="detail-card-title">维度三</h3>
          <p class="detail-card-text">维度说明文字。</p>
        </div>
      </div>
    </section>

    <!-- 5. 流程步骤：适合视频/流程类项目 -->
    <section class="detail-section">
      <h2 class="detail-section-title">创作流程</h2>
      <div class="detail-steps">
        <div class="detail-step">
          <div class="detail-step-number">01</div>
          <div class="detail-step-label">前期策划</div>
        </div>
        <div class="detail-step">
          <div class="detail-step-number">02</div>
          <div class="detail-step-label">拍摄执行</div>
        </div>
        <div class="detail-step">
          <div class="detail-step-number">03</div>
          <div class="detail-step-label">后期剪辑</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer-cta" style="margin-top: var(--space-24);">
    <div class="hero-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>
    <div class="container">
      <h2 class="footer-cta-title">下一个项目更精彩</h2>
      <p class="footer-cta-desc">继续浏览更多作品，或直接与我开始合作。</p>
      <div class="footer-cta-contacts">
        <a href="all-projects.html">查看全部作品</a>

      </div>
      <div class="footer-bottom">
        <p>&#169; 2026 梁金玲 Portfolio. All rights reserved.</p>
